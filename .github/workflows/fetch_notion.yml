name: Atualizar dados e publicar site

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */4 * * *'   # a cada 4 horas

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Gerar data.json
        env:
          NOTION_TOKEN_DOCS:    ${{ secrets.NOTION_TOKEN_DOCS }}
          NOTION_DB_DOCS:       ${{ secrets.NOTION_DB_DOCS }}
          NOTION_TOKEN_VENDAS:  ${{ secrets.NOTION_TOKEN_VENDAS }}
          NOTION_DB_VENDAS:     ${{ secrets.NOTION_DB_VENDAS }}
          ERP_CSV_PROPOSTAS:    ${{ secrets.ERP_CSV_PROPOSTAS }}
          ERP_CSV_PAGAMENTOS:   ${{ secrets.ERP_CSV_PAGAMENTOS }}
          ERP_CSV_OBRAS:        ${{ secrets.ERP_CSV_OBRAS }}
          ERP_CSV_RECEBIMENTOS: ${{ secrets.ERP_CSV_RECEBIMENTOS }}
          NOTION_TOKEN_METAS:   ${{ secrets.NOTION_TOKEN_METAS }}
          NOTION_DB_METAS:      ${{ secrets.NOTION_DB_METAS }}
        run: python fetch_all.py

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: atualizar data.json"
          git push

      - name: Preparar pasta de publicação
        run: |
          mkdir -p dist
          cp index.html dist/
          cp login.html dist/
          cp mapas.html dist/
          cp terrabela.html dist/
          cp documentos.html dist/
          cp vendas.html dist/
          cp analise.html dist/
          cp ravena.html dist/ 2>/dev/null || true
          cp pqdosburitis.html dist/ 2>/dev/null || true
          cp joaobraz2.html dist/ 2>/dev/null || true
          cp ipanema.html dist/ 2>/dev/null || true
          cp marquesdeabreu.html dist/ 2>/dev/null || true
          cp solarville.html dist/ 2>/dev/null || true
          cp acropole.html dist/ 2>/dev/null || true
          cp stefigenia.html dist/ 2>/dev/null || true
          cp data.json dist/
          cp logo.png dist/ 2>/dev/null || true
          cp TERRABELA_MAPA_DOCUMENTOS.svg dist/ 2>/dev/null || true
          cp TERRABELA_MAPA_VENDAS.svg dist/ 2>/dev/null || true
          cp RAVENA_DOCS.svg dist/ 2>/dev/null || true
          cp RAVENA_VENDAS.svg dist/ 2>/dev/null || true
          cp PQ_DOS_BURITIS_DOCS.svg dist/ 2>/dev/null || true
          cp PQ_DOS_BURITIS_VENDAS.svg dist/ 2>/dev/null || true
          cp JOAO_BRAZ_DOCS.svg dist/ 2>/dev/null || true
          cp JOAO_BRAZ_VENDAS.svg dist/ 2>/dev/null || true
          cp IPANEMA_DOCS.svg dist/ 2>/dev/null || true
          cp IPANEMA_VENDAS.svg dist/ 2>/dev/null || true
          cp MQ_DE_ABREU_DOCS.svg dist/ 2>/dev/null || true
          cp MQ_DE_ABREU_VENDAS.svg dist/ 2>/dev/null || true
          cp SOLAR_VILLE_DOCS.svg dist/ 2>/dev/null || true
          cp SOLAR_VILLE_VENDAS.svg dist/ 2>/dev/null || true
          cp ACROPOLE_DOCS.svg dist/ 2>/dev/null || true
          cp ACROPOLE_VENDAS.svg dist/ 2>/dev/null || true
          cp COND_ESMERALDAS_DOCS.svg dist/ 2>/dev/null || true
          cp esmeraldas.html dist/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
