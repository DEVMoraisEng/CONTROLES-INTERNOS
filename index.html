<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morais Engenharia · Controle Interno</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#295778;--azul-esc:#1e3f58;--teal:#8FDCD2;--verde:#2a9d5c;--verde-btn:#4cd964;
  --bg:#EAF1F3;--bg2:#F5F9FA;--bg3:#dceaef;--border:#b8d0da;--border2:#d0e4ec;
  --text:#1a3347;--text3:#5a8099;--text4:#8aacbb;--branco:#fff;
}
body{min-height:100vh;background:var(--bg);font-family:'Barlow',sans-serif;display:flex;flex-direction:column}
.header{background:var(--azul);border-bottom:3px solid var(--teal);padding:0 28px;
        height:68px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.hdr-logo{height:38px;flex-shrink:0}
.hdr-info{display:flex;flex-direction:column;flex:1}
.hdr-sup{font-size:11px;font-weight:700;color:var(--teal);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hdr-title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;color:#fff;letter-spacing:.02em}
.hdr-right{display:flex;align-items:center;gap:14px}
.updated{font-size:11px;color:rgba(255,255,255,.4);font-family:monospace}
.btn-logout{background:transparent;border:1px solid rgba(143,220,210,.4);border-radius:7px;
            padding:6px 14px;font-family:'Barlow Condensed',sans-serif;font-size:13px;
            font-weight:700;color:var(--teal);letter-spacing:.06em;cursor:pointer;transition:background .15s}
.btn-logout:hover{background:rgba(143,220,210,.18)}

/* LAYOUT PRINCIPAL */
.main{flex:1;padding:28px 32px 48px;max-width:1200px;margin:0 auto;width:100%}

/* LINHA SUPERIOR: 3 botões de controle */
.ctrl-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}

/* LINHA INFERIOR: 2 cidades lado a lado */
.cidades-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}

/* BOTÃO VER MAPAS */
.mapas-row{display:flex;justify-content:center;margin-bottom:0}

/* CARD PADRÃO */
.mod-card{background:var(--branco);border:2px solid var(--border);border-radius:12px;
          padding:18px 22px;cursor:pointer;transition:border-color .18s,box-shadow .18s;
          display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit}
.mod-card:hover{border-color:var(--teal);box-shadow:0 4px 18px rgba(41,87,120,.1)}
.mod-card.destaque{border-color:rgba(76,217,100,.5);background:linear-gradient(135deg,var(--branco) 80%,rgba(76,217,100,.06))}
.mod-card.destaque:hover{border-color:var(--verde-btn);box-shadow:0 4px 18px rgba(76,217,100,.15)}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;
            color:var(--azul);text-transform:uppercase;letter-spacing:.06em}
.card-badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
            letter-spacing:.08em;color:var(--text3);background:var(--bg3);
            border-radius:4px;padding:2px 8px;margin-top:2px;align-self:flex-start}
.card-badge.g{background:rgba(76,217,100,.15);color:#1a6b40}
.btn-acessar{display:inline-block;padding:8px 18px;background:var(--azul);color:#fff;
             border:none;border-radius:7px;font-family:'Barlow Condensed',sans-serif;
             font-size:14px;font-weight:800;letter-spacing:.07em;cursor:pointer;
             text-transform:uppercase;transition:background .15s;align-self:flex-start;
             text-decoration:none}
.btn-acessar:hover{background:var(--azul-esc)}
.btn-acessar.verde{background:var(--verde);padding:10px 28px;font-size:16px}
.btn-acessar.verde:hover{background:#1f7a43}

/* CIDADE BLOCO */
.cidade-bloco{background:var(--branco);border:2px solid var(--border);border-radius:12px;overflow:hidden}
.cidade-hdr{background:var(--azul);padding:12px 20px;display:flex;align-items:center;gap:10px}
.cidade-nome{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;
             color:#fff;text-transform:uppercase;letter-spacing:.07em;flex:1}
.cidade-body{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.setor-card{border:1.5px solid var(--border2);border-radius:8px;padding:12px 16px;
            background:var(--bg2);cursor:pointer;transition:border-color .15s,background .15s;
            text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px}
.setor-card:hover{border-color:var(--teal);background:var(--bg3)}
.setor-nome{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;
            color:var(--azul);text-transform:uppercase;letter-spacing:.05em}
.setor-stats{display:flex;gap:8px;flex-wrap:wrap}
.stat-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;
           letter-spacing:.05em;white-space:nowrap}
.pill-breve{background:rgba(176,200,212,.3);color:#4a7a99}
.pill-and{background:rgba(30,63,88,.15);color:var(--azul-esc)}
.pill-fin{background:rgba(42,157,92,.15);color:var(--verde)}
.pill-vend{background:rgba(143,220,210,.25);color:#1a6b6b}

/* BOTÃO MAPAS GRANDE */
.mapas-btn-wrap{text-align:center;padding:4px 0}

#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
         justify-content:center;z-index:500;flex-direction:column;gap:12px}
#loading.hidden{display:none}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--teal);
      border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:900px){
  .ctrl-row{grid-template-columns:1fr}
  .cidades-row{grid-template-columns:1fr}
  .main{padding:16px}
}
</style>
</head>
<body>
<div id="loading"><div class="spin"></div></div>

<header class="header">
  <img src="logo.png" class="hdr-logo" alt="Morais">
  <div class="hdr-info">
    <div class="hdr-sup">Morais Engenharia · Controle Interno</div>
    <div class="hdr-title">Painel de Controle</div>
  </div>
  <div class="hdr-right">
    <div class="updated" id="updated-at"></div>
    <button class="btn-logout" onclick="sair()">Sair</button>
  </div>
</header>

<div class="main">
  <!-- Linha 1: Controle e Análise -->
  <div class="ctrl-row">
    <div class="mod-card destaque" onclick="abrirAnalise(event)" onmousedown="handleAnaliseMouseDown(event)" title="Click: abrir · Ctrl+Click / Scroll: nova aba">
      <div class="card-title">📊 Análise de Dados</div>
      <div class="card-badge g">Dashboard · Metas · Prazos · Setorizadas</div>
      <a href="analise.html" class="btn-acessar verde" onclick="event.preventDefault();event.stopPropagation();abrirAnalise(event)" target="_blank" rel="noopener" id="btn-analise-link">Acessar →</a>
    </div>
    <a class="mod-card" href="documentos.html">
      <div class="card-title">📋 Gestão Documental</div>
      <div class="card-badge">Todos os Setores · 147 registros</div>
      <button class="btn-acessar">Acessar →</button>
    </a>
    <a class="mod-card" href="vendas.html">
      <div class="card-title">🏠 Gestão de Vendas</div>
      <div class="card-badge">Todos os Setores</div>
      <button class="btn-acessar">Acessar →</button>
    </a>
  </div>

  <!-- Linha 2: Cidades lado a lado -->
  <div class="cidades-row" id="cidades-row">
    <!-- preenchido pelo JS -->
  </div>

</div>

<!-- Modal análise — iframe pré-carregado igual à versão que funcionava -->
<div id="modal-analise" style="display:none;position:fixed;inset:0;z-index:1000;background:var(--bg);overflow:auto">
  <iframe id="iframe-analise" src="analise.html" style="width:100%;height:100%;border:none;display:block"></iframe>
</div>

<script>
// Auth — verificar antes de qualquer coisa
(function(){
  const HASH_OK=btoa("moraisengenharialtda:Morais1234@");
  if(localStorage.getItem("morais_auth")!==HASH_OK&&sessionStorage.getItem("morais_auth")!==HASH_OK){
    window.location.replace("login.html");
  }
})();

const HASH_OK=btoa("moraisengenharialtda:Morais1234@");

function sair(){
  localStorage.removeItem("morais_auth");
  sessionStorage.removeItem("morais_auth");
  window.location.replace("login.html");
}

// Análise: click normal = modal, Ctrl+Click ou meio = nova aba
function abrirAnalise(e){
  if(e && (e.ctrlKey || e.metaKey || e.button===1)){
    window.open('analise.html','_blank','noopener');
    return;
  }
  document.getElementById("modal-analise").style.display="block";
  document.body.style.overflow="hidden";
}
function handleAnaliseMouseDown(e){
  // Botão do meio (scroll) → abre nova aba
  if(e.button===1){
    e.preventDefault();
    window.open('analise.html','_blank','noopener');
  }
}
window.fecharAnalise=function(){
  document.getElementById("modal-analise").style.display="none";
  document.body.style.overflow="";
};

// Setores por cidade com links
// chave = valor EXATO de x.setor no data.json
const SETORES_CANEDO=[
  {nome:"Terrabela Cerrado",  chave:"TERRABELA CERRADO", link:"terrabela.html"},
  {nome:"Ravena",             chave:"RAVENA",            link:"ravena.html"},
  {nome:"Pq dos Buritis",    chave:"PQ DOS BURITIS",    link:"pqdosburitis.html"},
];
const SETORES_GOIANIA=[
  {nome:"João Braz 2",       chave:"JOÃO BRAZ 2",       link:"joaobraz2.html"},
  {nome:"Ipanema",           chave:"IPANEMA",            link:"ipanema.html"},
  {nome:"Marques de Abreu",  chave:"MARQUES DE ABREU",  link:"marquesdeabreu.html"},
  {nome:"Solar Ville",       chave:"SOLAR VILLE",        link:"solarville.html"},
  {nome:"Acrópole",          chave:"ACROPOLE",           link:"acropole.html"},
  {nome:"St. Efigênia",      chave:"ST EFIGÊNIA",        link:"stefigenia.html"},
];

// Normaliza para comparação: maiúsculas + sem acentos + sem pontuação
function normStr(s){
  return (s||'').trim().toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[.\-]/g,' ').replace(/\s+/g,' ').trim();
}

// Calcular status de lotes por setor
function calcStatusSetor(docs,vendas,nomeSetor,chaveSetor){
  if(!docs||!vendas)return{emBreve:0,andamento:0,finalizados:0,vendidas:0,total:0};
  // Casa pelo campo chave (nome exato do Notion), normalizado
  const alvo=normStr(chaveSetor||nomeSetor);
  const d=docs.filter(x=>normStr(x.setor)===alvo);
  const emBreve=d.filter(x=>!x.data_aquisicao_lote).length;
  const andamento=d.filter(x=>x.data_inicio_obra&&!x.data_termino_obra).length;
  const finCampos=["uso_solo_emitido","aprovacao_projeto","obra_iniciada","habite_se_concluido"];
  const finalizados=d.filter(x=>{
    if(x.data_termino_obra)return true;
    return finCampos.every(c=>x[c]==="SIM"||x[c]==="INEXISTE"||x[c]==="sim");
  }).length;
  const vendidas=vendas.filter(v=>v&&v.clientes&&normStr(v.setor)===alvo).length;
  return{emBreve,andamento,finalizados,vendidas,total:d.length};
}

function buildCidades(docs,vendas){
  function renderCidade(nome,setores){
    const cards=setores.map(s=>{
      const st=calcStatusSetor(docs,vendas,s.nome,s.chave)||{emBreve:0,andamento:0,finalizados:0,vendidas:0};
      const pills=`
        ${st.emBreve>0?`<span class="stat-pill pill-breve">Em Breve: ${st.emBreve}</span>`:''}
        ${st.andamento>0?`<span class="stat-pill pill-and">Em Andamento: ${st.andamento}</span>`:''}
        ${st.finalizados>0?`<span class="stat-pill pill-fin">Finalizados: ${st.finalizados}</span>`:''}
        ${st.vendidas>0?`<span class="stat-pill pill-vend">Vendidas: ${st.vendidas}</span>`:''}
      `;
      const pTrim=pills.trim().replace(/\s+/g,' ');
      return`<a class="setor-card" href="${s.link}">
        <div class="setor-nome">${s.nome}</div>
        <div class="setor-stats">${pTrim||'<span class="stat-pill pill-breve">Sem dados</span>'}</div>
      </a>`;
    }).join('');
    return`<div class="cidade-bloco">
      <div class="cidade-hdr"><div class="cidade-nome">🗺️ MAPAS DE SETORES — ${nome.toUpperCase()}</div></div>
      <div class="cidade-body">${cards}</div>
    </div>`;
  }
  document.getElementById("cidades-row").innerHTML=
    renderCidade("Senador Canedo",SETORES_CANEDO)+
    renderCidade("Goiânia",SETORES_GOIANIA);
}

async function init(){
  try{
    const r=await fetch("data.json");
    const data=await r.json();
    const docs=data.documentos||[];
    const vendas=data.vendas||[];
    if(data.updated_at)
      document.getElementById("updated-at").textContent=
        "Atualizado: "+new Date(data.updated_at).toLocaleString("pt-BR");
    buildCidades(docs,vendas);
    document.getElementById("loading").classList.add("hidden");
  }catch(e){
    document.getElementById("loading").innerHTML=
      `<div style="color:#c0392b;font-size:13px;padding:20px">Erro ao carregar: ${e.message}</div>`;
  }
}
// Garantir que o DOM está pronto antes de init()
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
