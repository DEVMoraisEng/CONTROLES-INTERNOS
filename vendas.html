<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Vendas · Todos os Setores · Morais Engenharia</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#295778;--azul-esc:#1e3f58;--azul-med:#2d6a96;
  --teal:#8FDCD2;--bg:#EAF1F3;--bg2:#F5F9FA;--bg3:#dde8ec;
  --border:#b8d0da;--border2:#d0e4ea;
  --text:#1a3347;--text2:#295778;--text3:#5a8099;--text4:#8aacbb;--branco:#fff;
  --verde:#2a9d5c;--vermelho:#c0392b;--amarelo:#c9a227;--laranja:#d46a1a;
  --v-cinza:#b0c8d4;--v-azul:#295778;--v-verde:#8FDCD2;
  --v-verm:#c0392b;--v-laranja:#d46a1a;--v-esc:#1a6b40;
}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;
     min-height:100vh;font-size:14px}
.header{background:var(--azul);border-bottom:3px solid var(--teal);
        padding:0 28px;height:64px;display:flex;align-items:center;
        justify-content:space-between;gap:16px}
.hdr-left{display:flex;align-items:center;gap:16px}
.hdr-logo{width:40px;height:40px;flex-shrink:0}
.hdr-sup{font-size:10px;font-weight:700;color:var(--teal);
         letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hdr-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;
           font-weight:800;color:#fff;letter-spacing:.02em;line-height:1.1}
.hdr-right{display:flex;align-items:center;gap:12px}
.updated{font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.45)}
.btn-voltar{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.75);
            font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
            text-decoration:none;padding:6px 14px;
            border:1.5px solid rgba(255,255,255,.2);border-radius:5px;transition:all .15s}
.btn-voltar:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.4)}
.tabela-section{padding:20px 28px 40px}
.tabela-header{display:flex;align-items:center;justify-content:space-between;
               margin-bottom:10px;gap:12px;flex-wrap:wrap}
#tabela-titulo{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;
               color:var(--azul);text-transform:uppercase;letter-spacing:.07em}
.tabela-controls{display:flex;gap:8px;flex-wrap:wrap}
.btn-sm{padding:7px 14px;font-family:'Barlow',sans-serif;font-size:11px;font-weight:600;
        letter-spacing:.05em;text-transform:uppercase;border:1.5px solid var(--border);
        background:var(--branco);color:var(--text2);border-radius:5px;cursor:pointer;transition:all .15s}
.btn-sm:hover{background:var(--bg3);border-color:var(--azul)}
.btn-sm.danger:hover{border-color:var(--vermelho);color:var(--vermelho)}
.btn-sm.excel{border-color:#1a7034;color:#1a7034}
.btn-sm.excel:hover{background:#f0faf3;border-color:#155228}
.filtros-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;padding:10px 12px;
             background:var(--branco);border:1px solid var(--border);border-radius:8px;align-items:center}
.filtro-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.07em;
              text-transform:uppercase;margin-right:4px;white-space:nowrap}
.filtro-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
             border:1.5px solid var(--border);background:var(--bg);font-size:11px;font-weight:600;
             color:var(--text2);cursor:pointer;transition:all .15s;user-select:none;white-space:nowrap}
.filtro-chip .chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.filtro-chip:hover{border-color:var(--azul-med);background:var(--bg3)}
.filtro-chip.active{background:var(--azul);border-color:var(--azul);color:#fff}
.filtro-sep{width:1px;height:18px;background:var(--border);margin:0 2px}
.filtro-clear{font-size:10px;color:var(--text3);cursor:pointer;padding:2px 6px;
              border-radius:3px;margin-left:auto}
.filtro-clear:hover{color:var(--vermelho)}
.tbl-outer{background:var(--branco);border:1px solid var(--border);border-radius:10px;
           overflow:hidden;box-shadow:0 2px 10px rgba(41,87,120,.07)}
.tbl-scroll{overflow-x:auto;max-height:75vh;overflow-y:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;min-width:800px}
thead{position:sticky;top:0;z-index:10}
thead th{padding:10px 12px;text-align:left;font-size:9.5px;font-weight:700;
         letter-spacing:.09em;text-transform:uppercase;color:#fff;background:var(--azul);
         border-right:1px solid rgba(255,255,255,.12);border-bottom:2px solid var(--teal);white-space:nowrap;
         cursor:pointer;user-select:none}
thead th:hover{background:var(--azul-med)}
thead th:last-child{border-right:none}
thead th .sort-icon{font-size:8px;margin-left:4px;opacity:.5}
thead th.sort-asc .sort-icon::after{content:'▲';opacity:1}
thead th.sort-desc .sort-icon::after{content:'▼';opacity:1}
thead th:not(.sort-asc):not(.sort-desc) .sort-icon::after{content:'⇅'}
thead tr.filter-row th{padding:4px 6px;background:var(--azul-esc);
                       border-bottom:1px solid rgba(143,220,210,.2);
                       border-right:1px solid rgba(255,255,255,.08);
                       cursor:default}
thead tr.filter-row th:last-child{border-right:none}
/* ─── FILTROS DE COLUNA (texto e select simples) ─── */
thead tr.filter-row input.col-filter-input,
thead tr.filter-row select.col-filter-select{
  width:100%;padding:3px 5px;font-size:10px;font-family:'DM Mono',monospace;
  background:rgba(255,255,255,.08);border:1px solid rgba(143,220,210,.2);
  border-radius:3px;color:rgba(255,255,255,.8);outline:none;transition:border-color .15s;
  -webkit-appearance:none;appearance:none}
thead tr.filter-row input.col-filter-input:focus,
thead tr.filter-row select.col-filter-select:focus{border-color:var(--teal);background:rgba(255,255,255,.12)}
thead tr.filter-row input.col-filter-input::placeholder{color:rgba(255,255,255,.3)}
thead tr.filter-row select.col-filter-select option{background:var(--azul-esc);color:#fff}
tbody tr{border-bottom:1px solid var(--border2);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#e8f3f7}
tbody td{padding:8px 12px;vertical-align:middle;border-right:1px solid var(--border2);color:var(--text)}
tbody td:last-child{border-right:none}
.cell-null{color:var(--text4);font-style:italic;font-size:10px}
.bool-sim{display:inline-block;background:rgba(42,157,92,.12);color:var(--verde);
          border:1px solid rgba(42,157,92,.3);border-radius:3px;padding:1px 5px;font-size:10px;font-weight:700}
.bool-nao{display:inline-block;background:rgba(192,57,43,.08);color:var(--vermelho);
          border:1px solid rgba(192,57,43,.2);border-radius:3px;padding:1px 5px;font-size:10px;font-weight:700}
.col-hidden{display:none}
.tbl-rel{position:relative}
.col-panel{display:none;position:absolute;right:0;top:36px;background:var(--branco);
           border:1px solid var(--border);border-radius:8px;padding:12px;z-index:100;
           box-shadow:0 4px 20px rgba(41,87,120,.12);min-width:200px;max-height:300px;overflow-y:auto}
.col-panel.open{display:block}
.col-panel label{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;
                 color:var(--text);cursor:pointer;border-bottom:1px solid var(--border2)}
.col-panel label:last-child{border-bottom:none}
#loading{position:fixed;inset:0;background:rgba(41,87,120,.88);display:flex;
         flex-direction:column;align-items:center;justify-content:center;
         z-index:999;color:#fff;gap:14px}
#loading.hidden{display:none}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);
         border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#tip{position:fixed;background:var(--azul-esc);color:#fff;border-radius:6px;padding:8px 12px;
     font-size:11px;pointer-events:none;display:none;z-index:200;border:1px solid var(--teal);
     line-height:1.5;max-width:220px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
#tip.on{display:block}
@media(max-width:768px){.tabela-section{padding:12px 16px 28px}.header{padding:0 16px}}

/* ─── COLUNA STICKY ─── */
.col-sticky{position:sticky!important;left:0;z-index:5!important;background:var(--azul)!important;box-shadow:2px 0 6px rgba(41,87,120,.15)}
.col-sticky-filter{position:sticky!important;left:0;z-index:4!important;background:var(--azul-esc)!important;box-shadow:2px 0 6px rgba(41,87,120,.15)}
.col-sticky-body{position:sticky!important;left:0;z-index:2;background:var(--branco);box-shadow:2px 0 6px rgba(41,87,120,.10)}
tbody tr:nth-child(even) .col-sticky-body{background:var(--bg2)}
tbody tr:hover .col-sticky-body{background:#e8f3f7}
tbody tr.selected .col-sticky-body{background:#d0e8f0!important}
th[data-key="endereco"],td.col-end{min-width:200px!important}

/* ─── MULTI-SELECT DROPDOWN ─── */
.ms-wrap{position:relative;width:100%}
.ms-btn{width:100%;padding:3px 20px 3px 5px;font-size:10px;font-family:'DM Mono',monospace;
  background:rgba(255,255,255,.08);border:1px solid rgba(143,220,210,.2);border-radius:3px;
  color:rgba(255,255,255,.85);cursor:pointer;text-align:left;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;position:relative}
.ms-btn::after{content:'▾';position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:8px;opacity:.6}
.ms-btn.active{border-color:var(--teal);background:rgba(143,220,210,.15)}
.ms-dropdown{display:none;position:fixed;background:#1e3f58;border:1px solid rgba(143,220,210,.3);
  border-radius:5px;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,.3);
  max-height:220px;overflow-y:auto;min-width:160px;max-width:260px}
.ms-dropdown.open{display:block}
.ms-search{width:100%;padding:5px 8px;font-size:10px;font-family:'DM Mono',monospace;
  background:rgba(255,255,255,.1);border:none;border-bottom:1px solid rgba(143,220,210,.2);
  color:#fff;outline:none}
.ms-search::placeholder{color:rgba(255,255,255,.4)}
.ms-item{display:flex;align-items:center;gap:7px;padding:5px 10px;font-size:10.5px;
  font-family:'DM Mono',monospace;color:rgba(255,255,255,.85);cursor:pointer;transition:background .1s;white-space:nowrap}
.ms-item:hover{background:rgba(143,220,210,.12)}
.ms-item input[type=checkbox]{accent-color:#8FDCD2;flex-shrink:0}
.ms-clear{padding:5px 10px;font-size:9.5px;color:#8FDCD2;cursor:pointer;
  border-top:1px solid rgba(143,220,210,.15);text-align:center}
.ms-clear:hover{background:rgba(143,220,210,.1)}

/* ─── COLUNA # VENDA ─── */
td.col-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);text-align:center;min-width:40px}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Carregando dados...</p></div>
<div id="tip"></div>

<header class="header">
  <div class="hdr-left">
    <svg class="hdr-logo" viewBox="0 0 42 42" fill="none">
      <rect width="42" height="42" rx="6" fill="rgba(143,220,210,.15)"/>
      <path d="M7 32V10L14.5 24L21 10L27.5 24L35 10V32" stroke="#8FDCD2" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M7 32H35" stroke="#8FDCD2" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="hdr-sup">Morais Engenharia · Controle Interno</div>
      <div class="hdr-title">Gestão de Vendas — Todos os Setores</div>
    </div>
  </div>
  <div class="hdr-right">
    <div class="updated" id="updated-at">—</div>
    <a href="index.html" class="btn-voltar">
      <svg width="12" height="12" fill="none" viewBox="0 0 12 12">
        <path d="M8 1L3 6l5 5" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Voltar
    </a>
  </div>
</header>

<div class="tabela-section">
  <div class="tabela-header">
    <div id="tabela-titulo">Gestão de Vendas</div>
    <div class="tabela-controls">
      <div class="tbl-rel">
        <button class="btn-sm" onclick="toggleColPanel()">⊞ Colunas</button>
        <div class="col-panel" id="col-panel"><div id="col-panel-list"></div></div>
      </div>
      <button class="btn-sm excel" onclick="exportarExcel()">⬇ Exportar Excel</button>
      <button class="btn-sm danger" onclick="limparFiltros()">↺ Limpar Filtros</button>
    </div>
  </div>

  <div class="filtros-bar" id="filtros-bar"></div>

  <div class="tbl-outer">
    <div class="tbl-scroll">
      <table>
        <thead>
          <tr id="tabela-head"></tr>
          <tr class="filter-row" id="tabela-filter-row"></tr>
        </thead>
        <tbody id="tabela-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const DATA_URL = 'data.json';
let allVendas = [];
let colFilters = {};
let hiddenCols = new Set();
let activeStatusFilters = new Set();

// CORREÇÃO #2 — ordenação de colunas
let sortKey = 'data_venda'; // padrão: data crescente (item 6)
let sortDir = 'asc';

// ─── HELPERS ─────────────────────────────────────────────
const fmtDate = s => {
  if (!s) return null;
  try { return new Date(s).toLocaleDateString('pt-BR'); } catch { return s; }
};
const fmtMoney = v => {
  if (v == null || v === '') return null;
  const n = Number(v);
  if (isNaN(n)) return String(v);
  return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
};
const diffDays = (a, b) => {
  try { return Math.round((new Date(b) - new Date(a)) / 86400000); } catch { return null; }
};
function isSim(v) { return v === true || String(v).toUpperCase().trim() === 'SIM'; }

// ─── COLS ────────────────────────────────────────────────
// CORREÇÃO #6 — coluna # venda (índice por ano) adicionada no início
const COLS_VENDAS = [
  { key: '_num_venda',            label: '#',                                            noSort: false },
  { key: 'endereco',              label: 'ENDEREÇO' },
  { key: 'casa',                  label: 'CASA' },
  { key: 'cidade',                label: 'CIDADE' },
  { key: 'setor',                 label: 'SETOR' },
  { key: 'clientes',              label: 'CLIENTES' },
  { key: 'data_venda',            label: 'DATA DA VENDA',                        fmt: fmtDate },
  { key: 'cpf',                   label: 'CPF' },
  { key: 'correspondente',        label: 'CORRESPONDENTE' },
  { key: 'corretor',              label: 'CORRETOR' },
  { key: 'avaliacao',             label: 'AVALIAÇÃO',                            fmt: fmtMoney },
  { key: 'validade',              label: 'VALIDADE',                             fmt: fmtDate },
  { key: 'valor_na_mao',          label: 'VALOR NA MÃO',                        fmt: fmtMoney },
  { key: 'comissao',              label: 'COMISSÃO',                             fmt: fmtMoney },
  { key: 'valor_venda_contrato',  label: 'VALOR DE COMPRA E VENDA NO CONTRATO', fmt: fmtMoney },
  { key: 'banco',                 label: 'BANCO' },
  { key: 'agencia',               label: 'AGÊNCIA' },
  { key: 'armazenou_contrato',    label: 'ARMAZENOU CONTRATO COMPRA E VENDA?',  fmt: 'bool' },
  { key: 'emitiu_rcpm',           label: 'EMITIU RCPM?',                        fmt: 'bool' },
  { key: 'mandou_docs_corresp',   label: 'MANDOU TODOS OS DOCS. P/ CORRESPONDENTE?', fmt: 'bool' },
  { key: 'data_envio_docs',       label: 'DATA DE ENVIO DOS DOCUMENTOS',        fmt: fmtDate },
  { key: 'mandou_conformidade',   label: 'MANDOU P/ CONFORMIDADE?',             fmt: 'bool' },
  { key: 'processo_conforme',     label: 'PROCESSO CONFORME?',                  fmt: 'bool' },
  { key: 'assinou_contrato_banco',label: 'ASSINOU E ARMAZENOU CONTRATO DO BANCO?', fmt: 'bool' },
  { key: 'data_assinatura',       label: 'DATA DE ASSINATURA DO CONTRATO',      fmt: fmtDate },
  { key: 'recebeu_taxa_vistoria', label: 'RECEBEU TAXA VISTORIA?',              fmt: 'bool' },
  { key: 'tem_cadastro',          label: 'TEM NÚMERO DE CADASTRO?',             fmt: 'bool' },
  { key: 'num_cadastro',          label: 'Nº DE CADASTRO PREFEITURA' },
  { key: 'entrada_cartorio',      label: 'DEU ENTRADA NO CARTÓRIO?',            fmt: 'bool' },
  { key: 'agendou_pre_vistoria',  label: 'AGENDOU PRÉ VISTORIA?',              fmt: 'bool' },
  { key: 'data_pre_vistoria',     label: 'DATA DA PRÉ-VISTORIA',               fmt: fmtDate },
  { key: 'tem_manual',            label: 'TEM MANUAL DE OBRA?',                 fmt: 'bool' },
  { key: 'registro_pronto',       label: 'FICOU PRONTO O REGISTRO?',            fmt: 'bool' },
  { key: 'devolveu_banco',        label: 'DEVOLVEU NO BANCO?',                  fmt: 'bool' },
  { key: 'recebeu',               label: 'RECEBEU?',                            fmt: 'bool' },
  { key: 'entregou_casa',         label: 'ENTREGOU A CASA E PEGOU TERMO DE ENTREGA?', fmt: 'bool' },
  { key: 'data_entrega',          label: 'DATA DA ENTREGA',                     fmt: fmtDate },
  { key: 'gcap_gerado',           label: 'GEROU E ARMAZENOU GCAP?',             fmt: 'bool' },
  { key: 'gcap_pago',             label: 'PAGOU GCAP?',                         fmt: 'bool' },
  { key: 'pesquisa',              label: 'PREENCHEU A PESQUISA?',               fmt: 'bool' },
];

// ─── STATUS ──────────────────────────────────────────────
function calcAlertaVenda(v) {
  if (!v.avaliacao || !v.data_envio_docs) return '';
  const dias = diffDays(v.data_envio_docs, new Date().toISOString());
  if (dias == null) return '';
  const conforme = isSim(v.processo_conforme);
  const assinou  = isSim(v.assinou_contrato_banco);
  const recebeu  = isSim(v.recebeu);
  if (dias >= 45 && conforme && assinou && !recebeu) return 'NÃO RECEBEU';
  if (dias >= 45 && (!conforme || !assinou)) return '45 DIAS';
  if (dias >= 20 && dias < 45 && (!conforme || !assinou || !recebeu)) return '20 DIAS';
  return '';
}

// Cada status granular continua existindo para sub-filtros
function calcStatusVenda(v) {
  if (isSim(v.entregou_casa)) return 'verde-esc';
  const alerta = calcAlertaVenda(v);
  if (alerta === 'NÃO RECEBEU') return 'laranja';
  if (alerta === '45 DIAS')     return 'vermelho';
  if (alerta === '20 DIAS')     return 'amarelo';
  if (v.clientes)  return 'verde-claro'; // vendida sem alertas
  if (v.avaliacao) return 'azul';
  return 'cinza';
}

// CORREÇÃO #5 — "Vendida" no chip engloba TODOS com clientes
const STATUS_VENDIDO_GROUP = new Set(['verde-claro','amarelo','vermelho','laranja','verde-esc']);

const COR_VENDAS = {
  cinza:'#b0c8d4', azul:'#295778', 'verde-claro':'#8FDCD2',
  amarelo:'#c9a227', vermelho:'#c0392b', laranja:'#d46a1a', 'verde-esc':'#1a6b40',
};
const STATUS_VENDAS_LABELS = {
  cinza:'Em breve', azul:'Disponível', 'verde-claro':'Vendida',
  amarelo:'>20 dias', vermelho:'>45 dias', laranja:'>45 dias s/ receber', 'verde-esc':'Entregue',
};

// ─── fmtCell ─────────────────────────────────────────────
function fmtCell(val, fmtFn) {
  if (fmtFn === 'bool') {
    if (val == null || val === '') return '<span class="cell-null">—</span>';
    const s = String(val).toUpperCase().trim();
    if (s === 'SIM' || val === true) return '<span class="bool-sim">SIM</span>';
    if (s === 'NÃO' || s === 'NAO' || val === false) return '<span class="bool-nao">NÃO</span>';
    if (s === 'ÁGIO' || s === 'AGIO')
      return `<span class="bool-sim" style="background:rgba(201,162,39,.15);color:#c9a227;border-color:rgba(201,162,39,.4)">ÁGIO</span>`;
    if (s === 'INEXISTE')
      return `<span class="bool-nao" style="background:rgba(90,128,153,.1);color:#5a8099;border-color:rgba(90,128,153,.3)">INEXISTE</span>`;
    return `<span class="bool-nao" style="background:rgba(90,128,153,.1);color:#5a8099;">${val}</span>`;
  }
  if (typeof fmtFn === 'function') {
    const r = fmtFn(val);
    return r != null ? String(r) : '<span class="cell-null">—</span>';
  }
  return val != null && val !== '' ? String(val) : '<span class="cell-null">—</span>';
}

// ─── CHIPS STATUS ────────────────────────────────────────
// CORREÇÃO #5 — chip "Vendida" agrega todos com clientes
function buildFiltrosBar() {
  const bar = document.getElementById('filtros-bar');
  // Contagem por status granular
  const counts = {};
  let totalVendidas = 0;
  allVendas.forEach(v => {
    const s = calcStatusVenda(v);
    counts[s] = (counts[s]||0)+1;
    if (STATUS_VENDIDO_GROUP.has(s)) totalVendidas++;
  });

  // Ordem: Disponível, Vendida (agregado), sub-status, Entregue, Em breve
  const chipsHtml = [];
  // Disponível
  if (counts['azul']) chipsHtml.push(`
    <span class="filtro-chip ${activeStatusFilters.has('azul')?'active':''}"
      onclick="toggleStatusFilter('azul')" data-status="azul">
      <span class="chip-dot" style="background:${COR_VENDAS['azul']}"></span>
      Disponível (${counts['azul']})
    </span>`);
  // Vendida (engloba todos com clientes)
  if (totalVendidas) chipsHtml.push(`
    <span class="filtro-chip ${activeStatusFilters.has('_vendida')?'active':''}"
      onclick="toggleStatusFilter('_vendida')" data-status="_vendida">
      <span class="chip-dot" style="background:#8FDCD2"></span>
      Vendida (${totalVendidas})
    </span>`);
  // Sub-status de vendida (alertas)
  ['amarelo','vermelho','laranja'].forEach(s => {
    if (counts[s]) chipsHtml.push(`
      <span class="filtro-chip ${activeStatusFilters.has(s)?'active':''}"
        onclick="toggleStatusFilter('${s}')" data-status="${s}">
        <span class="chip-dot" style="background:${COR_VENDAS[s]}"></span>
        ${STATUS_VENDAS_LABELS[s]} (${counts[s]})
      </span>`);
  });
  // Entregue
  if (counts['verde-esc']) chipsHtml.push(`
    <span class="filtro-chip ${activeStatusFilters.has('verde-esc')?'active':''}"
      onclick="toggleStatusFilter('verde-esc')" data-status="verde-esc">
      <span class="chip-dot" style="background:${COR_VENDAS['verde-esc']}"></span>
      Entregue (${counts['verde-esc']})
    </span>`);
  // Em breve
  if (counts['cinza']) chipsHtml.push(`
    <span class="filtro-chip ${activeStatusFilters.has('cinza')?'active':''}"
      onclick="toggleStatusFilter('cinza')" data-status="cinza">
      <span class="chip-dot" style="background:${COR_VENDAS['cinza']}"></span>
      Em breve (${counts['cinza']})
    </span>`);

  bar.innerHTML = `<span class="filtro-label">Status:</span>` +
    chipsHtml.join('') +
    `<span class="filtro-sep"></span>
     <span class="filtro-clear" onclick="clearStatusFilters()">✕ Limpar</span>`;
}

function toggleStatusFilter(s) {
  activeStatusFilters.has(s) ? activeStatusFilters.delete(s) : activeStatusFilters.add(s);
  buildFiltrosBar(); buildTabela();
}
function clearStatusFilters() { activeStatusFilters.clear(); buildFiltrosBar(); buildTabela(); }

// CORREÇÃO #6 — numerar vendas por ano (crescente data_venda)
function calcNumeracaoAnual(data) {
  // Ordenar por data_venda crescente para numerar
  const sorted = [...data]
    .filter(v => v.clientes && v.data_venda)
    .sort((a,b) => new Date(a.data_venda) - new Date(b.data_venda));
  const numMap = {}; // id -> { ano, num }
  const contadores = {};
  sorted.forEach(v => {
    const ano = new Date(v.data_venda).getFullYear();
    contadores[ano] = (contadores[ano]||0)+1;
    numMap[v.id || v.endereco] = { ano, num: contadores[ano] };
  });
  return numMap;
}

// ─── ORDENAÇÃO ───────────────────────────────────────────
// CORREÇÃO #2 — clique no cabeçalho ordena coluna
function sortData(data) {
  if (!sortKey) return data;
  return [...data].sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    // _num_venda: ordenar pelo número calculado
    if (sortKey === '_num_venda') {
      va = a._num_venda_raw || 0;
      vb = b._num_venda_raw || 0;
    }
    // datas
    if (typeof va === 'string' && va.match(/^\d{4}-\d{2}-\d{2}/)) {
      va = new Date(va); vb = vb ? new Date(vb) : new Date(0);
      return sortDir === 'asc' ? va-vb : vb-va;
    }
    // números
    if (!isNaN(Number(va)) && !isNaN(Number(vb))) {
      return sortDir === 'asc' ? Number(va)-Number(vb) : Number(vb)-Number(va);
    }
    // strings
    va = String(va||''); vb = String(vb||'');
    return sortDir === 'asc'
      ? va.localeCompare(vb,'pt-BR')
      : vb.localeCompare(va,'pt-BR');
  });
}

function setSortCol(key) {
  if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortKey = key; sortDir = 'asc'; }
  buildTabela();
}

// ─── FILTROS ─────────────────────────────────────────────
function applyColFilters(data, cols) {
  return data.filter(row =>
    cols.every(col => {
      const f = colFilters[col.key];
      if (!f || (f instanceof Set && f.size === 0) || f === '') return true;
      const rawVal = String(row[col.key] ?? '').toUpperCase().trim();
      if (f instanceof Set) {
        return [...f].some(fv => {
          if (fv === '—') return row[col.key] == null || row[col.key] === '';
          return rawVal === String(fv).toUpperCase().trim();
        });
      }
      return rawVal.includes(String(f).toUpperCase());
    })
  );
}

// ─── TABELA ──────────────────────────────────────────────
let _filteredData = [];
// Guarda o numMap atual para usar no export
let _numMap = {};

function buildTabela() {
  const cols = COLS_VENDAS;

  // 1. Filtro de status
  let data = [...allVendas];
  if (activeStatusFilters.size > 0) {
    data = data.filter(row => {
      const s = calcStatusVenda(row);
      // chip "_vendida" = todos do grupo vendido
      if (activeStatusFilters.has('_vendida') && STATUS_VENDIDO_GROUP.has(s)) return true;
      return activeStatusFilters.has(s);
    });
  }

  // 2. CORREÇÃO #6 — numerar por ano antes de filtrar (para manter sequência correta)
  _numMap = calcNumeracaoAnual(data);
  data.forEach(v => {
    const key = v.id || v.endereco;
    const info = _numMap[key];
    v._num_venda = info ? `${info.ano}/${String(info.num).padStart(3,'0')}` : '';
    v._num_venda_raw = info ? info.ano * 10000 + info.num : 0;
  });

  // 3. Filtros de coluna (cascata)
  // CORREÇÃO #3 — linha de filtros NÃO é recriada se há input ativo
  const activeEl = document.activeElement;
  const activeKey = activeEl && activeEl.dataset ? activeEl.dataset.filterKey : null;

  const filterRow = document.getElementById('tabela-filter-row');
  filterRow.innerHTML = cols.map((col, ci) => {
    const hidden = hiddenCols.has(col.key) ? 'col-hidden' : '';
    const sf = ci === 1 ? 'col-sticky-filter' : ''; // col 1 = endereco (0 = #)
    const cur = colFilters[col.key];
    const curStr = cur instanceof Set ? '' : (cur||'');

    // dados disponíveis para esta coluna (cascata)
    const dataParaCol = data.filter(row =>
      cols.every(c => {
        if (c.key === col.key) return true;
        const f = colFilters[c.key];
        if (!f || (f instanceof Set && f.size === 0) || f === '') return true;
        const rv = String(row[c.key] ?? '').toUpperCase().trim();
        if (f instanceof Set)
          return [...f].some(fv => fv === '—' ? (!row[c.key] && row[c.key] !== 0) : rv === String(fv).toUpperCase().trim());
        return rv.includes(String(f).toUpperCase());
      })
    );

    // colunas especiais sem filtro
    if (col.key === '_num_venda') {
      return `<th class="${hidden}"></th>`;
    }

    const uniq = [...new Set(dataParaCol.map(r=>r[col.key]).filter(v=>v!=null&&v!==''))].sort((a,b)=>String(a).localeCompare(String(b),'pt-BR'));
    const isBool = col.fmt === 'bool';
    const isMulti = isBool || (uniq.length > 0 && uniq.length <= 30);

    if (isMulti) {
      // CORREÇÃO #4 — multi-select com checkboxes
      const opts = isBool ? ['SIM','NÃO','ÁGIO','INEXISTE'] : uniq;
      const selSet = (cur instanceof Set) ? cur : new Set();
      const btnLabel = selSet.size ? [...selSet].join(', ') : `Todos (${dataParaCol.length})`;
      const isActive = selSet.size > 0;
      const ddId = `ms-dd-${col.key}`;
      return `<th class="${hidden} ${sf}">
        <div class="ms-wrap">
          <button class="ms-btn${isActive?' active':''}" id="ms-btn-${col.key}"
            onclick="openDropdown('${col.key}',this)">${btnLabel}</button>
          <div class="ms-dropdown" id="${ddId}">
            <input class="ms-search" placeholder="buscar..." oninput="filterMsSearch('${col.key}',this.value)" onclick="event.stopPropagation()">
            ${opts.map(v=>`
              <div class="ms-item" data-val="${v}" onclick="toggleMsOption('${col.key}','${v}',!document.getElementById('ms-cb-${col.key}-${v.replace(/[^a-zA-Z0-9]/g,'_')}').checked);event.stopPropagation()">
                <input type="checkbox" id="ms-cb-${col.key}-${v.replace(/[^a-zA-Z0-9]/g,'_')}"
                  ${selSet.has(v)?'checked':''} onclick="event.stopPropagation()">
                ${v}
              </div>`).join('')}
            <div class="ms-clear" onclick="clearMsFilter('${col.key}');event.stopPropagation()">✕ Limpar</div>
          </div>
        </div>
      </th>`;
    }

    // CORREÇÃO #3 — input de texto: usar oninput que não recria o elemento
    return `<th class="${hidden} ${sf}">
      <input class="col-filter-input" placeholder="filtrar..." value="${curStr}"
        data-filter-key="${col.key}"
        oninput="setTextFilter('${col.key}',this.value)"
        onclick="event.stopPropagation()">
    </th>`;
  }).join('');

  // Restaurar foco se havia input ativo
  if (activeKey) {
    const el = filterRow.querySelector(`[data-filter-key="${activeKey}"]`);
    if (el) { el.focus(); const len = el.value.length; el.setSelectionRange(len,len); }
  }

  // 4. Filtros coluna aplicados
  const filtered = applyColFilters(data, cols);

  // 5. Ordenação
  const sorted = sortData(filtered);

  // 6. Cabeçalho com ícones de ordenação
  document.getElementById('tabela-head').innerHTML = cols.map((col,ci) => {
    const hidden = hiddenCols.has(col.key) ? 'col-hidden' : '';
    const sticky = ci === 1 ? 'col-sticky' : '';
    const isSortCol = sortKey === col.key;
    const sortClass = isSortCol ? (sortDir === 'asc' ? 'sort-asc' : 'sort-desc') : '';
    const clickHandler = col.key === '_num_venda' ? '' : `onclick="setSortCol('${col.key}')"`;
    return `<th class="${hidden} ${sticky} ${sortClass}" data-key="${col.key}" ${clickHandler}>
      ${col.label}<span class="sort-icon"></span>
      ${col.key !== '_num_venda' ? `<span style="float:right;cursor:pointer;opacity:.4;font-size:9px;margin-left:4px"
        onclick="event.stopPropagation();toggleCol('${col.key}')"
        onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.4">✕</span>` : ''}
    </th>`;
  }).join('');

  // 7. Corpo
  document.getElementById('tabela-body').innerHTML = sorted.map((row,i) => `
    <tr style="${i%2===0?'':'background:var(--bg2)'}">
      ${cols.map((col,ci) => {
        const hidden = hiddenCols.has(col.key) ? 'col-hidden' : '';
        const sticky = ci === 1 ? 'col-sticky-body' : '';
        if (col.key === '_num_venda') {
          return `<td class="${hidden} col-num">${row._num_venda || ''}</td>`;
        }
        return `<td class="${hidden} ${sticky}">${fmtCell(row[col.key], col.fmt)}</td>`;
      }).join('')}
    </tr>`).join('')
    || '<tr><td colspan="99" style="text-align:center;color:#8aacbb;padding:28px;font-size:13px">Nenhum registro encontrado</td></tr>';

  // 8. Painel colunas
  document.getElementById('col-panel-list').innerHTML = cols.map(col => `
    <label><input type="checkbox" ${hiddenCols.has(col.key)?'':'checked'}
      onchange="toggleCol('${col.key}')"> ${col.label}</label>`).join('');

  document.getElementById('tabela-titulo').textContent =
    `Gestão de Vendas — Todos os Setores (${sorted.length})`;

  _filteredData = sorted;
}

// ─── FILTROS HELPERS ─────────────────────────────────────
function setFilter(key, val) { colFilters[key] = val; buildTabela(); }
// CORREÇÃO #3 — setTextFilter não reconstrói a tabela inteira, só o body
function setTextFilter(key, val) {
  colFilters[key] = val;
  // Reconstrói apenas o tbody para não perder foco
  const cols = COLS_VENDAS;
  let data = [...allVendas];
  if (activeStatusFilters.size > 0) {
    data = data.filter(row => {
      const s = calcStatusVenda(row);
      if (activeStatusFilters.has('_vendida') && STATUS_VENDIDO_GROUP.has(s)) return true;
      return activeStatusFilters.has(s);
    });
  }
  _numMap = calcNumeracaoAnual(data);
  data.forEach(v => {
    const k = v.id || v.endereco;
    const info = _numMap[k];
    v._num_venda = info ? `${info.ano}/${String(info.num).padStart(3,'0')}` : '';
    v._num_venda_raw = info ? info.ano * 10000 + info.num : 0;
  });
  const filtered = applyColFilters(data, cols);
  const sorted = sortData(filtered);
  document.getElementById('tabela-body').innerHTML = sorted.map((row,i) => `
    <tr style="${i%2===0?'':'background:var(--bg2)'}">
      ${cols.map((col,ci) => {
        const hidden = hiddenCols.has(col.key) ? 'col-hidden' : '';
        const sticky = ci === 1 ? 'col-sticky-body' : '';
        if (col.key === '_num_venda')
          return `<td class="${hidden} col-num">${row._num_venda || ''}</td>`;
        return `<td class="${hidden} ${sticky}">${fmtCell(row[col.key], col.fmt)}</td>`;
      }).join('')}
    </tr>`).join('')
    || '<tr><td colspan="99" style="text-align:center;color:#8aacbb;padding:28px;font-size:13px">Nenhum registro encontrado</td></tr>';
  document.getElementById('tabela-titulo').textContent =
    `Gestão de Vendas — Todos os Setores (${sorted.length})`;
  _filteredData = sorted;
}

function buildBody() { buildTabela(); }
function toggleCol(key) { hiddenCols.has(key)?hiddenCols.delete(key):hiddenCols.add(key); buildTabela(); }
function toggleColPanel() { document.getElementById('col-panel').classList.toggle('open'); }
function limparFiltros() { colFilters = {}; clearStatusFilters(); }
document.addEventListener('click', e => {
  if (!e.target.closest('.tbl-rel')) document.getElementById('col-panel').classList.remove('open');
});

// ─── MULTI-SELECT ENGINE ──────────────────────────────────
let _activeDropdown = null;
function openDropdown(key, btnEl) {
  if (_activeDropdown && _activeDropdown !== key) closeDropdown(_activeDropdown);
  const dd = document.getElementById('ms-dd-' + key);
  if (!dd) return;
  if (dd.classList.contains('open')) { closeDropdown(key); return; }
  const rect = btnEl.getBoundingClientRect();
  dd.style.top  = (rect.bottom + 2) + 'px';
  dd.style.left = rect.left + 'px';
  dd.style.minWidth = Math.max(rect.width, 160) + 'px';
  dd.classList.add('open');
  _activeDropdown = key;
  const srch = dd.querySelector('.ms-search');
  if (srch) srch.focus();
}
function closeDropdown(key) {
  const dd = document.getElementById('ms-dd-' + key);
  if (dd) dd.classList.remove('open');
  if (_activeDropdown === key) _activeDropdown = null;
}
document.addEventListener('click', e => {
  if (!e.target.closest('.ms-wrap') && !e.target.closest('.ms-dropdown')) {
    if (_activeDropdown) closeDropdown(_activeDropdown);
  }
  if (!e.target.closest('.tbl-rel')) document.getElementById('col-panel').classList.remove('open');
});
function toggleMsOption(key, val, shouldCheck) {
  if (!colFilters[key] || typeof colFilters[key] === 'string') colFilters[key] = new Set();
  const cbId = `ms-cb-${key}-${val.replace(/[^a-zA-Z0-9]/g,'_')}`;
  const cb = document.getElementById(cbId);
  if (cb) cb.checked = shouldCheck;
  if (shouldCheck) colFilters[key].add(val);
  else colFilters[key].delete(val);
  if (colFilters[key].size === 0) colFilters[key] = '';
  updateMsBtn(key);
  buildTabela();
}
function clearMsFilter(key) {
  colFilters[key] = '';
  updateMsBtn(key);
  const dd = document.getElementById('ms-dd-' + key);
  if (dd) dd.querySelectorAll('input[type=checkbox]').forEach(c => c.checked = false);
  buildTabela();
}
function updateMsBtn(key) {
  const btn = document.getElementById('ms-btn-' + key);
  if (!btn) return;
  const s = colFilters[key];
  if (!s || (s instanceof Set && s.size === 0) || s === '') {
    btn.textContent = 'Todos'; btn.classList.remove('active');
  } else if (s instanceof Set) {
    btn.textContent = [...s].join(', '); btn.classList.add('active');
  }
}
function filterMsSearch(key, q) {
  const dd = document.getElementById('ms-dd-' + key);
  if (!dd) return;
  dd.querySelectorAll('.ms-item').forEach(item => {
    item.style.display = item.dataset.val.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}

// ─── EXPORTAR EXCEL ──────────────────────────────────────
function exportarExcel() {
  const cols = COLS_VENDAS.filter(c => !hiddenCols.has(c.key));
  const headers = cols.map(c => c.label);
  const rows = _filteredData.map(row =>
    cols.map(col => {
      if (col.key === '_num_venda') return row._num_venda || '';
      const v = row[col.key];
      if (v == null || v === '') return '';
      if (col.fmt === 'bool') return String(v);
      if (typeof col.fmt === 'function') { const r = col.fmt(v); return r != null ? r : ''; }
      return String(v);
    })
  );
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws['!cols'] = headers.map((h,i) => ({wch: Math.max(h.length, ...rows.map(r=>String(r[i]||'').length), 10)}));
  XLSX.utils.book_append_sheet(wb, ws, 'Vendas');
  XLSX.writeFile(wb, `Gestao_Vendas_${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.xlsx`);
}

// ─── INIT ────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch(DATA_URL);
    const data = await r.json();
    // CORREÇÃO #6 — ordenar por data_venda crescente por padrão
    allVendas = (data.vendas || []).sort((a,b) => {
      if (!a.data_venda && !b.data_venda) return 0;
      if (!a.data_venda) return 1;
      if (!b.data_venda) return -1;
      return new Date(a.data_venda) - new Date(b.data_venda);
    });
    if (data.updated_at)
      document.getElementById('updated-at').textContent =
        'Atualizado: ' + new Date(data.updated_at).toLocaleString('pt-BR');
    buildFiltrosBar();
    buildTabela();
    document.getElementById('loading').classList.add('hidden');
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<div style="color:#c0392b;font-size:14px">Erro ao carregar dados:<br>${e.message}</div>`;
  }
}
init();
</script>
